<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: file:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Linear Notes Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <main id="page">
    <div id="properties" aria-label="Document properties"></div>
    <div id="editor"></div>
    <textarea id="source" spellcheck="false" aria-label="Markdown source" hidden></textarea>
    <div id="endnote"></div>
  </main>
  <div id="slash" class="popover" role="listbox" aria-label="Insert a block" hidden></div>
  <div id="bubble" class="popover" role="toolbar" aria-label="Selection formatting" hidden>
    <button data-command="paragraph" aria-label="Text style" title="Text style">H⌄</button>
    <span class="separator"></span>
    <button data-command="bold" aria-label="Bold" title="Bold · ⌘B"><b>B</b></button>
    <button data-command="italic" aria-label="Italic" title="Italic · ⌘I"><i>I</i></button>
    <button data-command="strike" aria-label="Strikethrough" title="Strikethrough · ⌘⇧S"><s>S</s></button>
    <button data-command="underline" aria-label="Underline" title="Underline · ⌘U"><u>U</u></button>
    <button data-command="link" aria-label="Link" title="Link · ⌘K">↗</button>
    <button data-command="quote" aria-label="Blockquote" title="Blockquote">❞</button>
    <span class="separator"></span>
    <button data-command="code" aria-label="Inline code" title="Inline code · ⌘E">‹›</button>
    <button data-command="codeBlock" aria-label="Code block" title="Code block · ⌘⇧\">{ }</button>
    <button data-command="bullet" aria-label="Bulleted list" title="Bulleted list · ⌘⇧8">☷</button>
    <button data-command="task" aria-label="Checklist" title="Checklist · ⌘⇧7">☑</button>
  </div>
  <dialog id="link-dialog">
    <form method="dialog" id="link-form">
      <h2>Add a link</h2><p>Insert an inline link or a resource card.</p>
      <label>URL<input id="link-url" type="url" required placeholder="https://…"></label>
      <label>Display text<input id="link-title" placeholder="A helpful title"></label>
      <div class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button value="link">Markdown link</button><button value="card" class="primary">Rich card</button></div>
    </form>
  </dialog>
  <dialog id="properties-dialog">
    <form method="dialog" id="properties-form">
      <h2>Document properties</h2><p>Stored as YAML at the top of your Markdown file.</p>
      <textarea id="properties-source" aria-label="YAML properties" spellcheck="false" placeholder="status: draft&#10;tags: [notes]"></textarea>
      <div class="dialog-actions"><button value="cancel">Cancel</button><button value="save" class="primary">Save properties</button></div>
    </form>
  </dialog>
  <script src="editor.js"></script>
</body>
</html>
