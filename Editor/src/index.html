<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: https: notes-asset: 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Linear Notes Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <main id="page">
    <div id="properties" aria-label="Document properties"></div>
    <div id="editor"></div>
    <textarea id="source" spellcheck="false" aria-label="Markdown source" hidden></textarea>
    <div id="endnote"></div>
    <div id="image-error" role="alert" hidden></div>
  </main>
  <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" aria-label="Choose an image" hidden>
  <dialog id="image-dialog"><form method="dialog">
    <h2>Image description</h2><p>Describe the image for people using a screen reader.</p>
    <label>Alt text<input id="image-alt" maxlength="1000"></label>
    <div class="dialog-actions"><button value="cancel">Cancel</button><button value="save" class="primary">Save</button></div>
  </form></dialog>
  <dialog id="callout-dialog"><form method="dialog">
    <h2>Callout style</h2>
    <label>Colour<input id="callout-colour" type="color"></label>
    <div class="callout-swatches">
      <button type="button" data-callout-colour="">Default</button>
      <button type="button" data-callout-colour="#8794f5" aria-label="Violet">Violet</button>
      <button type="button" data-callout-colour="#73c7a5" aria-label="Green">Green</button>
      <button type="button" data-callout-colour="#e1bd70" aria-label="Amber">Amber</button>
      <button type="button" data-callout-colour="#de8aa4" aria-label="Rose">Rose</button>
    </div>
    <label>Icon or emoji<input id="callout-icon" maxlength="64" placeholder="Use the default icon"></label>
    <div class="callout-icons">
      <button type="button" data-callout-icon="" aria-label="Default icon">Default</button>
      <button type="button" data-callout-icon="💡" aria-label="Light bulb">💡</button>
      <button type="button" data-callout-icon="📌" aria-label="Pin">📌</button>
      <button type="button" data-callout-icon="⭐" aria-label="Star">⭐</button>
      <button type="button" data-callout-icon="⚠" aria-label="Warning">⚠</button>
      <button type="button" data-callout-icon="✓" aria-label="Check">✓</button>
    </div>
    <div class="dialog-actions"><button value="cancel">Cancel</button><button value="save" class="primary">Apply</button></div>
  </form></dialog>
  <div id="slash" class="popover" role="listbox" aria-label="Insert a block" hidden></div>
  <div id="bubble" class="popover" role="toolbar" aria-label="Selection formatting" hidden>
    <button data-command="paragraph" aria-label="Text style" title="Text style">H⌄</button>
    <span class="separator"></span>
    <button data-command="bold" aria-label="Bold" title="Bold · ⌘B"><b>B</b></button>
    <button data-command="italic" aria-label="Italic" title="Italic · ⌘I"><i>I</i></button>
    <button data-command="strike" aria-label="Strikethrough" title="Strikethrough · ⌘⇧S"><s>S</s></button>
    <button data-command="underline" aria-label="Underline" title="Underline · ⌘U"><u>U</u></button>
    <button data-command="link" aria-label="Link" title="Link · ⌘K">↗</button>
    <button data-command="quote" aria-label="Blockquote" title="Blockquote">❞</button>
    <span class="separator"></span>
    <button data-command="code" aria-label="Inline code" title="Inline code · ⌘E">‹›</button>
    <button data-command="codeBlock" aria-label="Code block" title="Code block · ⌘⇧\">{ }</button>
    <button data-command="bullet" aria-label="Bulleted list" title="Bulleted list · ⌘⇧8">☷</button>
    <button data-command="task" aria-label="Checklist" title="Checklist · ⌘⇧7">☑</button>
  </div>
  <dialog id="link-dialog">
    <form method="dialog" id="link-form">
      <h2>Add a link</h2><p>Insert an inline link or a resource card.</p>
      <label>URL<input id="link-url" type="url" required placeholder="https://…"></label>
      <label>Display text<input id="link-title" placeholder="A helpful title"></label>
      <div class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button value="link">Markdown link</button><button value="card" class="primary">Rich card</button></div>
    </form>
  </dialog>
  <dialog id="properties-dialog">
    <form method="dialog" id="properties-form">
      <h2>Document properties</h2><p>Stored as YAML at the top of your Markdown file.</p>
      <textarea id="properties-source" aria-label="YAML properties" spellcheck="false" placeholder="status: draft&#10;tags: [notes]"></textarea>
      <div class="dialog-actions"><button value="cancel">Cancel</button><button value="save" class="primary">Save properties</button></div>
    </form>
  </dialog>
  <script src="editor.js"></script>
</body>
</html>
